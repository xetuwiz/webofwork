name: ai

# The AI service gate.
#
# ## Why this runs the suite twice
#
# Once offline on fixtures, once with no provider keys at all. The second run is
# what catches a change that has quietly started depending on a live model: a
# test that passes on a recorded response and fails against Groq is a test that
# was measuring the fixture, not the code.
#
# Neither run touches the network. That is the property worth protecting -- a
# suite that can be made to pass by a provider having a good minute is a suite
# that reports on the provider.
#
# ## Why there is no dotnet build here
#
# The .NET suite is a separate workflow on a five-to-nine minute clock. Splitting
# them means a failure here is unambiguously in the Python service, which is
# worth more than the few minutes saved by sharing a job.

on:
  push:
    paths:
      - "ai/**"
      - ".github/workflows/ai.yml"
  pull_request:
    paths:
      - "ai/**"
      - ".github/workflows/ai.yml"

concurrency:
  group: ai-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ai-service:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ai/requirements.txt

      - name: Install
        working-directory: ai
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # pytest-cov is a measurement tool, not a runtime one, so it is not in
          # requirements.txt where it would ship to the container.
          pip install pytest-cov

      # ── 1. offline, on fixtures ────────────────────────────────────────
      #
      # `LLM_ALLOW_FIXTURE_FALLBACK=false` is load-bearing. With it true, a
      # missing fixture falls through to *generating* an answer, and the suite
      # passes against output nobody wrote. That is the single most dangerous
      # setting in this file.
      - name: Test (offline, recorded fixtures)
        working-directory: ai
        env:
          INTERNAL_API_KEY: ci-not-a-real-key
          APP_ENV: development
          LLM_PROVIDER_CHAIN: fixture
          LLM_ALLOW_FIXTURE_FALLBACK: "false"
        run: python -m pytest -q

      # ── 2. no keys at all ──────────────────────────────────────────────
      #
      # With the chain set to a provider that has no key, `build_providers`
      # returns nothing and every model call fails. Any test that silently
      # depends on a live model fails here instead of intermittently on a
      # maintainer's machine.
      - name: Test (no provider configured)
        working-directory: ai
        env:
          INTERNAL_API_KEY: ci-not-a-real-key
          APP_ENV: development
          LLM_PROVIDER_CHAIN: groq
          LLM_GROQ_API_KEYS: ""
          LLM_ALLOW_FIXTURE_FALLBACK: "false"
        run: python -m pytest -q

      # ── 3. coverage, with a floor ──────────────────────────────────────
      #
      # The 80% figure is the plan's target and the measured value. The floor is
      # set one point below so an ordinary change does not break the build, and
      # so a real drop does -- which is the only time anyone reads this.
      - name: Coverage
        working-directory: ai
        env:
          INTERNAL_API_KEY: ci-not-a-real-key
          APP_ENV: development
          LLM_PROVIDER_CHAIN: fixture
          LLM_ALLOW_FIXTURE_FALLBACK: "false"
        run: |
          python -m pytest -q \
            --cov=ai.agents --cov=ai.tools --cov=ai.llm --cov=ai.policies \
            --cov-report=term-missing --cov-report=xml \
            --cov-fail-under=79

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-coverage
          path: ai/coverage.xml
          if-no-files-found: error

      # ── 4. the application actually assembles ───────────────────────────
      #
      # This used to build the image and run it. Docker is not part of this
      # project's toolchain, and the image build was red anyway -- the Dockerfile
      # copies its context into /app while the entrypoint asks for `ai.main`, so
      # that module path cannot resolve. Neither of those is a fact about the
      # service, and a red gate for them says nothing useful about the code.
      #
      # What is worth knowing is whether `ai.main` imports and routes, because a
      # missing module anywhere in a chain of relative imports breaks the service
      # at startup and no amount of unit testing notices. One second, no container.
      - name: The app imports and routes
        working-directory: ai
        env:
          # The repository root, not ai/. This step runs with ai/ as its working
          # directory, so the `ai` package is its parent -- and pytest.ini's
          # `pythonpath` applies to pytest only, not to a bare interpreter.
          PYTHONPATH: ${{ github.workspace }}
          INTERNAL_API_KEY: ci-not-a-real-key
          APP_ENV: development
          LLM_PROVIDER_CHAIN: fixture
          LLM_ALLOW_FIXTURE_FALLBACK: "false"
        run: |
          python - <<'PY'
          import sys
          from ai.main import app

          routes = {r.path for r in app.routes if hasattr(r, "path")}
          expected = {"/health", "/agent/chat"}
          missing = expected - routes
          if missing:
              sys.exit(f"missing routes: {sorted(missing)}; found {sorted(routes)}")
          print(f"  routes ok: {sorted(expected)}")
          PY

      # ── 5. no key material ─────────────────────────────────────────────
      #
      # The cheapest check here and the one most likely to catch a mistake.
      # `ai/.env` is gitignored, but gitignored is not the same as absent from a
      # commit somebody makes with `--no-verify`.
      #
      # Every provider prefix below is followed by a required run of 20+ token
      # characters. The bare prefixes were a false positive waiting to happen:
      # `cohere_` matches `llm_cohere_api_keys`, which is a settings field name in
      # ai/config.py, and `gsk_` matches `llm_gsk_api_keys` the same way. So this
      # step was failing on every branch over two identifiers that are not
      # secrets -- which trains people to ignore the one check that would catch a
      # real key. Real Cohere, Groq and Cerebras keys are all far longer than 20
      # characters after the prefix, so the length requirement costs no
      # detection. backend.yml already does this for the `sk-` family.
      - name: No key material in the repository
        run: |
          if git grep -nEI '(AQ\.Ab8RN6|gsk_[A-Za-z0-9]{20,}|csk-[A-Za-z0-9]{20,}|nvapi-[A-Za-z0-9]{20,}|mstrl_[A-Za-z0-9]{20,}|sk-or-v1-[A-Za-z0-9]{20,}|cohere_[A-Za-z0-9]{20,})' \
               -- ':!*.example' ':!ai/docs/*' ':!.github/workflows/*'; then
            echo "::error::key-shaped material found in a tracked file. Revoke it."
            exit 1
          fi
          echo "  no key-shaped strings in tracked files"

      - name: ai/.env is ignored
        run: |
          if [ -f ai/.env ]; then
            git check-ignore -q ai/.env \
              || { echo "::error::ai/.env exists but is not ignored"; exit 1; }
            echo "  ai/.env exists and is ignored (expected locally)"
          fi
          git check-ignore -q ai/.env.example || {
            echo "::error::ai/.env.example is ignored, so nobody can bootstrap"; exit 1; }
          echo "  ai/.env.example is tracked"

  # ── the guards, on their own ──────────────────────────────────────────
  #
  # A separate job so they are unmistakable in the checks list. They take two
  # seconds and they are the only things standing between "no raw model I/O is
  # persisted" and "we decided not to persist raw model I/O", which are very
  # different sentences.
  architecture-guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - working-directory: ai
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run the guards
        working-directory: ai
        env:
          INTERNAL_API_KEY: ci-not-a-real-key
          LLM_PROVIDER_CHAIN: fixture
          LLM_ALLOW_FIXTURE_FALLBACK: "false"
        run: |
          # Naming a test file that is not in the tree is a *usage* error, and
          # pytest reports it as exit code 4. A guard job that dies with "4"
          # reads as "the guards failed" when nothing was actually checked, which
          # is the worst possible failure mode for a job whose entire job is to
          # be believed.
          #
          # So: run every guard test that is present, warn loudly about the ones
          # that are not, and let a real assertion failure still fail the build.
          # The warning is deliberately a ::warning:: and not a notice -- these
          # tests are the only thing holding the "no raw model I/O is persisted"
          # guarantee in place, and their absence should be visible in the checks
          # list until they are committed.
          shopt -s nullglob
          targets=(tests/test_architecture_guards.py tests/test_ordering.py)
          present=()
          missing=()
          for t in "${targets[@]}"; do
            if [ -f "$t" ]; then present+=("$t"); else missing+=("$t"); fi
          done

          for t in "${missing[@]}"; do
            echo "::warning::$t is not committed. Its assertions are not being checked."
          done

          if [ ${#present[@]} -eq 0 ]; then
            echo "::error::no guard tests present -- nothing is enforcing the architecture rules"
            exit 1
          fi

          python -m pytest "${present[@]}" -v
