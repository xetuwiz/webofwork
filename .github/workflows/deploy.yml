name: deploy

# Deploys the API and the AI service to the VPS.
#
# ## What runs where
#
# The API is *built here*, on the runner, and the published output is uploaded.
# The box itself has no build role: it holds dotnet-sdk-8.0 only so it can be
# rebuilt by hand for debugging, and nothing in this file depends on that.
# Building on a 2-core production host to save an 18 MB upload is a bad trade --
# it makes the deploy as slow as a cold restore and puts a compiler on the
# machine that serves traffic.
#
# ## Why not rsync-deployments
#
# rsync over ssh is the usual choice and it works, but it needs rsync on both
# ends and a --delete that will happily remove a secrets/ directory or a
# hand-placed appsettings. A tar streamed over ssh and unpacked into a fresh
# staging directory, then swapped, cannot delete anything that was not in the
# tarball.
#
# ## What is deliberately NOT deployed
#
# appsettings.Production.json and secrets/ never leave the box. They are
# generated from appsettings.Development.json by hand, they are gitignored, and
# they are mode 600. A workflow that rsynced a config file would eventually
# publish one with a live password in it.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  API_DIR: /var/www/webofwork-api
  AI_DIR: /var/www/webofwork-ai

jobs:
  api:
    name: deploy api
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish
        run: |
          # linux-x64 and framework-dependent: the box has the .NET 8 runtime but
          # this keeps the output small and avoids shipping a duplicated runtime
          # per service.
          dotnet publish server/WebOfWork.Api/WebOfWork.Api.csproj \
            -c Release \
            -r linux-x64 \
            --self-contained false \
            -o publish

      - name: Upload
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          tar -czf api.tar.gz -C publish .
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new api.tar.gz \
            ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_HOST }}:/tmp/api.tar.gz

      - name: Install and restart
        run: |
          # The directory is passed as a positional argument rather than read from
          # a workflow-level env var. An earlier revision had `API_DIR=$API_DIR`
          # inside the heredoc: env: defines that on the runner, but `ssh <<REMOTE`
          # starts a fresh shell on the remote where it does not exist, and set -u
          # turned the reference into "unbound variable". Both jobs died on line 2,
          # before the staging directory was touched.
          ssh -i ~/.ssh/deploy_key ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_HOST }} \
            "bash -s -- '$API_DIR'" <<'REMOTE'
          set -euo pipefail
          API_DIR="$1"
          STAGE=/var/www/webofwork-staging

          rm -rf "$STAGE"
          mkdir -p "$STAGE"
          tar -xzf /tmp/api.tar.gz -C "$STAGE"

          # Move the config and secret aside, unpack the build beside them, then
          # put them back. rsync --delete would have taken these with it.
          for keep in appsettings.Production.json appsettings.json secrets; do
            if [ -e "$API_DIR/$keep" ]; then
              mv "$API_DIR/$keep" "$STAGE/$keep"
            fi
          done

          # Atomic-ish swap: the old tree is kept until the new one is in place,
          # so a failed unpack does not leave the service with nothing to run.
          OLD=/var/www/webofwork-api.previous
          rm -rf "$OLD"
          mv "$API_DIR" "$OLD"
          mv "$STAGE" "$API_DIR"
          rm -rf "$OLD"

          chown -R xetuwiz:xetuwiz "$API_DIR"
          chmod 600 "$API_DIR/appsettings.Production.json" 2>/dev/null || true

          sudo -n systemctl restart webofwork-api
          sleep 12
          curl -fsS --max-time 20 http://127.0.0.1:5000/health
          echo
          rm -f /tmp/api.tar.gz
          REMOTE

  ai:
    name: deploy ai service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Matches the deployed venv. The suite has no 3.11+ syntax, but pinning
          # the runner to the interpreter the service actually runs on means a
          # test can never pass here and fail there.
          python-version: "3.12"

      - name: Test before deploying
        env:
          INTERNAL_API_KEY: ci-not-a-real-key
          APP_ENV: development
          LLM_PROVIDER_CHAIN: fixture
          LLM_ALLOW_FIXTURE_FALLBACK: "false"
        working-directory: ai
        run: |
          pip install -r requirements.txt
          python -m pytest -q

      - name: Upload
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # ai/.env is the live provider-key file and is gitignored, so it is not
          # in the tarball; the box keeps the one it already has.
          tar -czf ai.tar.gz --exclude=tests --exclude=__pycache__ \
              --exclude=.pytest_cache --exclude=.ruff_cache --exclude=docs \
              --exclude=.coverage --exclude=.env --exclude=Dockerfile ai
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new ai.tar.gz \
            ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_HOST }}:/tmp/ai.tar.gz

      - name: Install and restart
        run: |
          # Positional argument for the same reason as the api job: a workflow
          # env var is not visible inside an ssh heredoc.
          ssh -i ~/.ssh/deploy_key ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_HOST }} \
            "bash -s -- '$AI_DIR'" <<'REMOTE'
          set -euo pipefail
          AI_DIR="$1"

          tar -xzf /tmp/ai.tar.gz -C "$AI_DIR"

          # Provider keys and the internal key stay put across deploys. An
          # earlier revision of this workflow replaced the whole directory and
          # silently reset DOTNET_BASE_URL to the development value, which made
          # every agent tool call fail with "All connection attempts failed"
          # while the tests stayed green.
          if [ ! -f "$AI_DIR/ai/.env" ]; then
            echo "FATAL: $AI_DIR/ai/.env is missing. Refusing to start without provider keys." >&2
            exit 1
          fi
          grep -q '^DOTNET_BASE_URL=http://127.0.0.1:5000$' "$AI_DIR/ai/.env" \
            || { echo "FATAL: DOTNET_BASE_URL is not pointing at the production API." >&2; exit 1; }

          chown -R xetuwiz:xetuwiz "$AI_DIR"
          sudo -n systemctl restart webofwork-ai
          sleep 10
          curl -fsS --max-time 20 http://127.0.0.1:8001/health
          echo
          rm -f /tmp/ai.tar.gz
          REMOTE

  verify:
    name: verify public endpoint
    runs-on: ubuntu-latest
    needs: [api, ai]
    steps:
      # The two jobs above each prove their own service answers on loopback.
      # This proves the whole chain: DNS, TLS, nginx, and the API -- the parts
      # none of them can see.
      - name: Health over public HTTPS
        run: |
          for i in $(seq 1 10); do
            if curl -fsS --max-time 15 https://api.xetuwiz.de/health; then
              echo
              echo "public endpoint healthy"
              exit 0
            fi
            echo "attempt $i: not ready, waiting"
            sleep 10
          done
          echo "::error::https://api.xetuwiz.de/health never became healthy"
          exit 1

      - name: Certificate is valid and not expiring
        run: |
          echo | openssl s_client -connect api.xetuwiz.de:443 -servername api.xetuwiz.de 2>/dev/null \
            | openssl x509 -noout -subject -issuer -dates
