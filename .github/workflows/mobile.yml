name: mobile

# The Flutter gate.
#
# ## Why analyze is reported but not enforced
#
# `flutter analyze` exits non-zero on `info`, and this app currently carries 205 of
# them: untyped uninitialized fields, `withOpacity` deprecations, missing `const`,
# a couple of BuildContext-across-async-gap warnings. None is an error and none is
# a broken build.
#
# Enforcing it today would mean the only possible first run is red, and a red gate
# that cannot be turned green without an unrelated 205-file cleanup gets ignored --
# which would cost the test run below its attention. So analyze runs on every
# change, its findings are in the log, and it does not decide the build.
#
# When the backlog is cleared, delete `continue-on-error` below. That one line is
# the whole gate.

on:
  push:
    paths:
      - "mobile/**"
      - ".github/workflows/mobile.yml"
  pull_request:
    paths:
      - "mobile/**"
      - ".github/workflows/mobile.yml"

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Matches the version this project is developed against (3.47.5). A
          # floating "stable" means a Dart SDK bump can turn a green main into a
          # red one with no commit, and the failure looks like the code's.
          flutter-version: "3.47.5"
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze
        continue-on-error: true
        run: flutter analyze

      # Not `flutter test || echo "..."`. Swallowing a test failure makes the
      # suite look green when it is not, which is the one thing a test gate
      # exists to prevent.
      - name: Test
        run: flutter test

  # The job that would have caught the release endpoint.
  #
  # `flutter analyze` does not evaluate a `String.fromEnvironment` default, and
  # `flutter test` runs in debug mode where `kReleaseMode` is false -- so
  # `_assertReleaseEndpointIsSecure` is skipped and a plain-http or LAN endpoint
  # passes every other gate in this workflow. The build then ships an APK that
  # rejects every request at the socket layer with no Dart-side error, which on a
  # device you cannot attach a debugger to is indistinguishable from a dead API.
  #
  # Not hypothetical: the default was `http://192.168.8.100:5000` and this
  # workflow was green throughout.
  #
  # Building also catches the release-variant-only failures -- the strict
  # `src/main/res/xml/network_security_config.xml` and the release signing config,
  # neither of which any debug or test run loads.
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Same pin as the mobile job above, deliberately: a floating "stable"
          # would let a Dart SDK bump turn this red with no commit.
          flutter-version: "3.47.5"
          cache: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build release APK
        # No --dart-define, deliberately. This asserts the *default* endpoint
        # yields a working release build, which is exactly what passing an
        # explicit --dart-define here would hide.
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: webofwork-mobile-release
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14