# Skill relationships.
#
# ## Why this is a data file and not code
#
# Every entry here is a claim a human made about how two skills relate. Putting
# them in code makes reviewing a change mean reading a diff of logic; putting
# them in YAML makes it mean reading a list of claims. Given that a wrong edge
# silently changes who gets hired, the second is much easier to check.
#
# ## The four edge types
#
# `same_as`      -- literally the same thing. Symmetric. Credit 1.0.
# `implies`      -- knowing `from` means you can do `to`. Directed. Credit 1.0.
# `weakly_implies` -- knowing `from` suggests you *might* do `to`. Directed. Credit < 1.
# `sibling`      -- related, NOT interchangeable. Symmetric. Credit 0.0, and it
#                   VETOES: checked before anything else, so no other edge can
#                   rescue a pair the humans decided must not match.
#
# ## Why `sibling` exists at all
#
# Because a similarity model puts React and Angular right next to each other --
# both are frontend JavaScript frameworks. That is correct as clustering and
# catastrophic as a hiring decision. An explicit veto says "yes these are
# related, and no, a React developer is not an Angular developer", which no
# distance function can express.
#
# ## Direction matters, and both directions are written out
#
# C# implies .NET. .NET does NOT imply C# -- a .NET developer may write F# or
# VB.NET. So the two directions are separate entries with separate weights,
# rather than one edge plus an inferred inverse. Nothing here is inferred; every
# pair a human wrote is visible.
#
# ## Single hop only
#
# `csharp implies aspnet-core` is deliberately absent. C# implies .NET and
# ASP.NET Core implies .NET, but chaining them would claim a C# developer is an
# ASP.NET developer, which is false -- they may be writing desktop or games.
# Scoring never chains. Multi-hop is only ever used for suggestions.
#
# ## Coverage
#
# This covers the skills a freelancer realistically lists against marketplace
# briefs. It is not the whole universe, and it does not need to be: every pair
# absent from it resolves exactly as it did before this file existed.

version: 1

