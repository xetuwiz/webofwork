# Explicit non-matches. These VETO: a pair listed here earns zero credit no
# matter what any other rule says, and no inference is drawn from them.
#
# ## Every name here must also be an `aliases` key
#
# This list used to name skills -- vue, angular, aws, mysql, flask -- that appeared
# nowhere in `aliases`. The names normalised fine, so the veto fired for the two
# literal strings and for nothing else: `VueJS` normalised to `vuejs`, which was
# not in the sibling set, so a Vue developer quietly satisfied a React brief
# whenever they spelled it the way people actually spell it. There is now a load-
# time guard in `ai/skills/ontology.py` that rejects an endpoint with no canonical
# entry, and a test that exercises the veto through real spellings.
siblings:
  # -- javascript frameworks: related, and not interchangeable ------------------
  - [react, angular]
  - [react, vue]
  - [angular, vue]
  - [react, svelte]
  - [react, reactnative]
  - [react, jquery]

  # -- languages: one polyglot is not another ----------------------------------
  - [csharp, java]
  - [csharp, python]
  - [csharp, javascript]
  - [javascript, java]
  - [java, python]
  - [java, php]
  - [node, python]
