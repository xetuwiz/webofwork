  # -- the missing frontend framework names ------------------------------------
  # These were absent while the `siblings` list already referred to them. That is
  # the failure this section fixes: a veto naming "vue" never fires for someone who
  # wrote "VueJS" or "Vue.js", because those normalise to `vuejs` and were not in
  # the canonical table. The veto silently stopped applying to the spellings people
  # actually type.
  # `angularjs` is its own canonical. AngularJS (1.x) and Angular (2+) are a
  # sibling pair: the first is JavaScript, the second is TypeScript, and hiring
  # for one and getting the other is a real and expensive mistake.
  # The bare spelling `AngularJS` belongs here; `angular.js` and `angular js` are
  # claimed by `angular` below, because they are how Angular 2+ is usually written.
  # AngularJS (1.x) and Angular (2+) are recorded as ONE canonical, `angular`.
  #
  # An earlier attempt gave them two entries. That cannot work: `normalise` strips
  # separators, so "angular.js", "angular js" and "angularjs" all reduce to the
  # same string, and the load-time guard rejected the second entry. The version
  # distinction cannot be expressed in this vocabulary at all.
  #
  # What that costs: a client who specifically needs AngularJS 1.x gets partial
  # treatment. Deliberate, because the alternative -- a canonical that matches
  # nothing -- is worse. Version-specific requirements belong in the brief text,
  # which `ai.skills.text_overlap` reads.
  angular:
    - angular
    - angular 2
    - angularjs
    - angular.js
    - angular js
  jquery:
    - j query
    - jquery ui
  vue:
    - vuejs
    - vue.js
    - vue js
    - vue 3
  svelte:
    - sveltekit
    - svelte kit

