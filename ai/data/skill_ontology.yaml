# Directed and symmetric edges. `weight` is the credit a match earns.
edges:
  # -- platform / language -----------------------------------------------------
  # A C# developer works on .NET by definition: you cannot write C# without it.
  - { type: implies, from: csharp, to: dotnet, weight: 1.0 }
  # The reverse is weaker. Someone who knows .NET may write F# or VB.NET.
  - { type: weakly_implies, from: dotnet, to: csharp, weight: 0.6 }

  # ASP.NET Core is a framework on the platform, not the language itself, so
  # these do not chain: having C# does not mean having ASP.NET Core.
  - { type: implies, from: aspnetcore, to: csharp, weight: 1.0 }
  - { type: implies, from: aspnetcore, to: dotnet, weight: 1.0 }
  - { type: weakly_implies, from: dotnet, to: aspnetcore, weight: 0.5 }

  # -- javascript ecosystem ----------------------------------------------------
  - { type: implies, from: react, to: javascript, weight: 1.0 }
  - { type: weakly_implies, from: javascript, to: react, weight: 0.6 }
  - { type: implies, from: nextjs, to: react, weight: 1.0 }
  - { type: weakly_implies, from: javascript, to: typescript, weight: 0.5 }
  - { type: implies, from: typescript, to: javascript, weight: 1.0 }

  # -- data --------------------------------------------------------------------
  - { type: implies, from: postgresql, to: databases, weight: 1.0 }
  - { type: weakly_implies, from: databases, to: postgresql, weight: 0.5 }
  - { type: weakly_implies, from: databases, to: mongodb, weight: 0.3 }
  - { type: implies, from: kubernetes, to: aws, weight: 0.6 }
  - { type: implies, from: aws, to: continuousintegration, weight: 0.5 }

  # -- non-technical -----------------------------------------------------------
  - { type: implies, from: machinelearning, to: machinelearningops, weight: 0.6 }
  - { type: implies, from: uxDesign, to: UXDesign, weight: 1.0 }

  # -- design ------------------------------------------------------------------
  # A design system is built from tokens, not the other way round. The reverse is
  # weak: a token file on its own is usually part of a system nobody maintains.
  - { type: implies, from: designsystem, to: designtokens, weight: 1.0 }
  - { type: weakly_implies, from: designtokens, to: designsystem, weight: 0.5 }

  # Infographics are a way of presenting data, so one implies the other weakly.
  # They are not siblings -- an infographic *is* a data visualisation -- but neither
  # substitutes for the other, so the credit is partial.
  - { type: weakly_implies, from: infographic, to: dataviz, weight: 0.6 }
  - { type: weakly_implies, from: dataviz, to: infographic, weight: 0.6 }

  # Motion design is the broader practice; motion graphics is the deliverable.
  - { type: implies, from: motiondesign, to: motiongraphics, weight: 1.0 }
  - { type: weakly_implies, from: motiongraphics, to: motiondesign, weight: 0.6 }

  # Colour correction in a photo workflow usually involves grading, and vice
  # versa. Partial both ways, because a grader is not automatically a photo
  # retoucher.
  - { type: weakly_implies, from: colourcorrection, to: colourgrading, weight: 0.5 }
  - { type: weakly_implies, from: colourgrading, to: colourcorrection, weight: 0.5 }

  # Web design and UI design overlap heavily; UI design is the stronger claim.
  - { type: weakly_implies, from: webdesign, to: uidesign, weight: 0.7 }
  - { type: weakly_implies, from: uidesign, to: webdesign, weight: 0.6 }

  # Product design is UX plus UI plus the decisions in between.
  - { type: implies, from: productdesign, to: UXDesign, weight: 0.9 }
  - { type: implies, from: productdesign, to: uidesign, weight: 0.9 }
  - { type: weakly_implies, from: UXDesign, to: productdesign, weight: 0.6 }

  # Interaction design sits between wireframing and prototyping.
  - { type: weakly_implies, from: interactiondesign, to: prototyping, weight: 0.6 }
  - { type: weakly_implies, from: prototyping, to: wireframing, weight: 0.6 }

  # Brand identity work normally produces guidelines; the reverse is not true of a
  # freelance guideline writer who does not do identity.
  - { type: implies, from: brandidentity, to: brandguidelines, weight: 1.0 }
  - { type: weakly_implies, from: brandguidelines, to: brandidentity, weight: 0.5 }

  # A logo and a brand identity are deliberately NOT connected here. They are a
  # sibling pair below, because a client commissioning a full identity needs
  # someone who does the whole thing -- a logo artist is not automatically that.
  # The load-time guard caught this contradiction when both lists were added.

  # -- platforms ---------------------------------------------------------------
  # Anyone using one of these editors can produce the file; the reverse is not
  # true, so the direction matters.
  - { type: implies, from: canva, to: graphicdesign, weight: 0.5 }
  - { type: implies, from: figma, to: designsystem, weight: 0.5 }
  - { type: weakly_implies, from: designsystem, to: figma, weight: 0.5 }

  - { type: implies, from: wordpress, to: php, weight: 0.9 }
  - { type: weakly_implies, from: php, to: wordpress, weight: 0.4 }

  # React Native is a sibling of React, not a consequence of it: a mobile brief
  # must not be satisfied by web React work, which is exactly the substitution the
  # veto exists to prevent. What React Native genuinely shares is the language.
  - { type: weakly_implies, from: reactnative, to: javascript, weight: 0.6 }
