[pytest]
asyncio_mode = auto
testpaths = tests

# The test modules import the service as `ai.agents...`, `ai.tools...` -- the
# package is addressed by its repository-root name, not as a sibling of `tests`.
# That import only resolves when the repository root is on sys.path.
#
# pytest prepends sys.path[0] with the rootdir of each test module, which here is
# `ai/`, so `import ai` fails with ModuleNotFoundError. It works on a developer
# machine purely because people run `pytest` from the repository root, where the
# current directory supplies the package -- so the suite was green locally and
# red in CI, every run, on every branch. This line is the fix, and it makes the
# suite runnable from either directory.
pythonpath = . ..
filterwarnings =
    ignore::DeprecationWarning
