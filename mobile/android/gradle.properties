# 1536M was the Android Studio template default and is far too small for
# AGP 8.11 + Kotlin 2.2 -- the build died with "Java heap space" in
# JetifyTransform. 4G is the current Flutter template default.
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G
# The Kotlin compiler runs in its own JVM, so it needs its own budget too.
kotlin.daemon.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
# Jetifier rewrites pre-AndroidX support-library deps. Nothing in this
# project's plugin graph references com.android.support, so it was pure
# overhead -- and it was the transform that ran the daemon out of memory.
android.enableJetifier=false
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
